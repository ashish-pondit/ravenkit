[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyutils"
version = "0.1.0"
description = "Small, dependency-light CLI helpers for everyday dataset and folder chores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "dataset", "images", "utility"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pyutils = "pyutils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Typer's API requires `typer.Option(...)` / `typer.Argument(...)` as defaults.
ignore = ["B008"]
